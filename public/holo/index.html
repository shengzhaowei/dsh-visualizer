<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Learn Agent</title>
<link rel="stylesheet" href="src/styles.css">
</head>
<body>
<h1 class="sr">Learn Agent</h1>
<main class="stage">
  <!-- Slay-the-Spire style AI Merchant single-item shop backdrop -->
  <div class="shop-backdrop" id="shop" aria-hidden="true">
    <div class="shop-lantern">
      <div class="shop-lantern-cord"></div>
      <div class="shop-lantern-lamp"></div>
      <div class="shop-lantern-glow"></div>
    </div>

    <div class="shop-merchant" id="merchant">
      <svg class="merchant-svg" viewBox="0 0 240 220" width="240" height="220">
        <defs>
          <!-- 3D glossy studio volume gradients matching the 5 mascot cards -->
          <radialGradient id="cloak3d" cx="38%" cy="24%" r="72%">
            <stop offset="0%" stop-color="#606ea0"/>
            <stop offset="45%" stop-color="#353f64"/>
            <stop offset="85%" stop-color="#1e243d"/>
            <stop offset="100%" stop-color="#131729"/>
          </radialGradient>
          <radialGradient id="hood3d" cx="36%" cy="22%" r="74%">
            <stop offset="0%" stop-color="#6c7cb3"/>
            <stop offset="44%" stop-color="#3a456e"/>
            <stop offset="88%" stop-color="#202742"/>
            <stop offset="100%" stop-color="#15192d"/>
          </radialGradient>
          <radialGradient id="hoodCavity" cx="50%" cy="48%" r="58%">
            <stop offset="0%" stop-color="#1b233b"/>
            <stop offset="75%" stop-color="#101526"/>
            <stop offset="100%" stop-color="#090c17"/>
          </radialGradient>
          <radialGradient id="visor3d" cx="42%" cy="30%" r="70%">
            <stop offset="0%" stop-color="#2c4466"/>
            <stop offset="55%" stop-color="#152236"/>
            <stop offset="100%" stop-color="#0a111e"/>
          </radialGradient>
          <radialGradient id="goldGem" cx="35%" cy="28%" r="68%">
            <stop offset="0%" stop-color="#fff4c4"/>
            <stop offset="50%" stop-color="#f2be54"/>
            <stop offset="100%" stop-color="#b5741c"/>
          </radialGradient>
          <radialGradient id="paw3d" cx="36%" cy="28%" r="68%">
            <stop offset="0%" stop-color="#fff0dc"/>
            <stop offset="55%" stop-color="#e7be94"/>
            <stop offset="100%" stop-color="#b58356"/>
          </radialGradient>
          <radialGradient id="contactShadow" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#2b1e14" stop-opacity="0.34"/>
            <stop offset="100%" stop-color="#2b1e14" stop-opacity="0"/>
          </radialGradient>
          <linearGradient id="visorGlass" x1="15%" y1="0%" x2="85%" y2="100%">
            <stop offset="0%" stop-color="#ffffff" stop-opacity="0.38"/>
            <stop offset="45%" stop-color="#ffffff" stop-opacity="0.06"/>
            <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
          </linearGradient>
          <linearGradient id="goldTrim" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#ffe599"/>
            <stop offset="50%" stop-color="#e4a943"/>
            <stop offset="100%" stop-color="#ffe599"/>
          </linearGradient>
          <filter id="ledGlow" x="-40%" y="-40%" width="180%" height="180%">
            <feGaussianBlur stdDeviation="2.4" result="b"/>
            <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
          </filter>
          <filter id="toyDrop" x="-20%" y="-20%" width="140%" height="140%">
            <feDropShadow dx="0" dy="10" stdDeviation="9" flood-color="#1e1726" flood-opacity="0.24"/>
          </filter>
        </defs>

        <!-- Soft studio ambient contact shadow -->
        <ellipse cx="120" cy="198" rx="72" ry="12" fill="url(#contactShadow)"/>

        <g class="merchant-body-bob" filter="url(#toyDrop)">
          <!-- Plump 3D rounded cloaked torso (no flat cut-off!) -->
          <path d="M40 164 C40 122, 72 104, 120 104 C168 104, 200 122, 200 164 C200 188, 172 198, 120 198 C68 198, 40 188, 40 164 Z" fill="url(#cloak3d)"/>
          <!-- Soft golden mantle trim -->
          <path d="M58 188 C66 146, 88 130, 120 130 C152 130, 174 146, 182 188" fill="none" stroke="url(#goldTrim)" stroke-width="3" stroke-linecap="round" opacity="0.72"/>
          <!-- Specular highlight on left shoulder -->
          <ellipse cx="76" cy="134" rx="22" ry="9" transform="rotate(-24 76 134)" fill="#ffffff" opacity="0.16"/>

          <!-- Plump 3D pointed hood -->
          <path d="M56 116 C48 68, 76 22, 120 14 C164 22, 192 68, 184 116 C174 134, 66 134, 56 116 Z" fill="url(#hood3d)"/>
          <!-- Top-left glossy studio highlight on hood -->
          <ellipse cx="96" cy="40" rx="26" ry="11" transform="rotate(-24 96 40)" fill="#ffffff" opacity="0.28"/>
          <ellipse cx="74" cy="60" rx="7" ry="4" transform="rotate(-32 74 60)" fill="#ffffff" opacity="0.34"/>

          <!-- Deep hood rim with soft gold piping -->
          <path d="M68 112 C62 74, 84 38, 120 32 C156 38, 178 74, 172 112 C160 126, 80 126, 68 112 Z" fill="url(#hoodCavity)" stroke="url(#goldTrim)" stroke-width="2.2" stroke-opacity="0.7"/>

          <!-- Curved 3D glossy glass visor -->
          <rect x="80" y="56" width="80" height="56" rx="20" fill="url(#visor3d)" stroke="#8aefff" stroke-opacity="0.4" stroke-width="1.5"/>
          <!-- Diagonal studio glass glaze reflection -->
          <path d="M88 60 H134 L106 108 H84 C81 102, 81 66, 88 60 Z" fill="url(#visorGlass)"/>

          <!-- Glowing LED eyes (normal, track cursor) -->
          <g class="m-eyes-normal" filter="url(#ledGlow)">
            <g class="m-eye-track">
              <rect x="97" y="73" width="12" height="15" rx="6" fill="#82f2ff"/>
              <rect x="131" y="73" width="12" height="15" rx="6" fill="#82f2ff"/>
              <circle cx="101" cy="77.5" r="2.6" fill="#ffffff"/>
              <circle cx="135" cy="77.5" r="2.6" fill="#ffffff"/>
            </g>
            <path d="M112 96 Q120 102 128 96" fill="none" stroke="#82f2ff" stroke-width="2.8" stroke-linecap="round"/>
          </g>

          <!-- Excited glowing eyes while ripping -->
          <g class="m-eyes-rip" filter="url(#ledGlow)">
            <circle cx="103" cy="81" r="8" fill="#ffe082"/>
            <circle cx="137" cy="81" r="8" fill="#ffe082"/>
            <circle cx="100.5" cy="78" r="2.8" fill="#ffffff"/>
            <circle cx="134.5" cy="78" r="2.8" fill="#ffffff"/>
            <ellipse cx="120" cy="96" rx="5.5" ry="4.5" fill="#ffe082"/>
          </g>

          <!-- Happy ^ ◡ ^ glowing eyes when cards spread -->
          <g class="m-eyes-happy" filter="url(#ledGlow)">
            <path d="M95 83 Q103 72 111 83" fill="none" stroke="#93f8ac" stroke-width="3.4" stroke-linecap="round"/>
            <path d="M129 83 Q137 72 145 83" fill="none" stroke="#93f8ac" stroke-width="3.4" stroke-linecap="round"/>
            <path d="M111 93 Q120 103 129 93" fill="none" stroke="#93f8ac" stroke-width="3" stroke-linecap="round"/>
          </g>

          <!-- 3D glossy golden brooch clasp -->
          <circle cx="120" cy="133" r="9.5" fill="url(#goldGem)"/>
          <circle cx="120" cy="133" r="4.2" fill="#7cf0ff"/>
          <circle cx="118" cy="131" r="1.6" fill="#ffffff" opacity="0.9"/>

          <!-- Plump 3D rounded toy paws -->
          <g>
            <ellipse cx="76" cy="182" rx="18" ry="12" fill="url(#paw3d)"/>
            <ellipse cx="71" cy="177" rx="7" ry="3.5" transform="rotate(-15 71 177)" fill="#ffffff" opacity="0.5"/>
          </g>
          <g>
            <ellipse cx="164" cy="182" rx="18" ry="12" fill="url(#paw3d)"/>
            <ellipse cx="159" cy="177" rx="7" ry="3.5" transform="rotate(-15 159 177)" fill="#ffffff" opacity="0.5"/>
          </g>
        </g>
      </svg>

      <div class="shop-bubble" id="merchantBubble">本店只卖这一包，撕开看看？</div>
    </div>

    <!-- Woven merchant carpet / counter -->
    <div class="shop-counter">
      <div class="shop-rug">
        <div class="shop-rug-border"></div>
      </div>
      <div class="shop-price-tag">
        <span class="shop-price-dot"></span>
        <span>0 TOKEN · 仅售此包</span>
      </div>
    </div>
  </div>

  <i class="ground" id="ground"></i>
  <div class="scene" id="scene">
    <div class="flow" id="flow" aria-hidden="true"><svg class="rays" id="rays" viewBox="0 0 100 76"></svg></div>
    <div class="pack" id="pack">
      <div class="skin front" aria-hidden="true">
        <span class="tag">撕开卡包 ⟶</span><span class="lips"><i class="lip"></i></span>
        <b class="mark">Agent 学习包</b><span class="series"></span>
        <div class="orb">
        </div>
        <span class="foot l">Harness</span><span class="foot r">5 选 1</span>
      </div>
      <div class="skin back" aria-hidden="true">
        <i class="fin"></i><b class="mark sm">Agent 学习包</b>
        <p class="blurb">DeepSeek · Pi · Codex<br>Claude Code · LangChain</p>
        <i class="code"></i>
      </div>
      <div class="flap" id="flap" aria-hidden="true"></div>
      <button class="hit" id="hit" type="button" aria-label="Learn Agent 卡包：向右拖动顶部撕开，或点击直接打开"></button>
    </div>
  </div>
  <canvas class="fx" id="fx" aria-hidden="true"></canvas>
  <div class="warp-portal" id="warpPortal" aria-hidden="true"></div>
</main>
<button class="again" id="again" type="button" hidden>再撕一包</button>
<button class="mute" id="mute" type="button" aria-label="Mute sound" aria-pressed="false"><svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M4 9.5v5h3.5l4.5 4v-13l-4.5 4z" fill="currentColor"/><g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><g class="on"><path d="M15.5 9.2a4 4 0 0 1 0 5.6"/><path d="M18.2 6.8a7.5 7.5 0 0 1 0 10.4"/></g><g class="off"><path d="m15.5 9.5 5 5m0-5-5 5"/></g></g></svg></button>
<p class="sr" id="live" aria-live="polite"></p>

<script defer src="src/art.js"></script>
<script defer src="src/app.js"></script>
</body>
</html>
