<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 740" width="420" height="740">
  <defs>
    <linearGradient id="cdxHair" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f2ecff"/>
      <stop offset="50%" stop-color="#cfc3f7"/>
      <stop offset="100%" stop-color="#9e8ce8"/>
    </linearGradient>
    <linearGradient id="cdxHairShade" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#b4a3ee"/>
      <stop offset="100%" stop-color="#7c68cc"/>
    </linearGradient>
    <linearGradient id="cdxSkirt" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#22253a"/>
      <stop offset="100%" stop-color="#131626"/>
    </linearGradient>
    <linearGradient id="cdxEye" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4c2db8"/>
      <stop offset="58%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="cdxGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
  </defs>

  <!-- Floating Pixel Cyber-Cube Companion -->
  <g transform="translate(306, 134)">
    <rect x="6" y="10" width="38" height="32" rx="7" fill="#1e1b3a" stroke="#a78bfa" stroke-width="2.4"/>
    <rect x="13" y="18" width="6" height="6" rx="1.5" fill="#22d3ee"/>
    <rect x="31" y="18" width="6" height="6" rx="1.5" fill="#22d3ee"/>
    <rect x="20" y="29" width="10" height="3.5" rx="1.5" fill="#fb923c"/>
    <rect x="16" y="2" width="4" height="8" rx="1" fill="#a78bfa"/>
    <rect x="30" y="2" width="4" height="8" rx="1" fill="#22d3ee"/>
    <path d="M-8 14 l3 -6 l3 6 l6 3 l-6 3 l-3 6 l-3 -6 l-6 -3 z" fill="#22d3ee" opacity="0.9"/>
    <path d="M52 2 l2.2 -4.5 l2.2 4.5 l4.5 2.2 l-4.5 2.2 l-2.2 4.5 l-2.2 -4.5 l-4.5 -2.2 z" fill="#a78bfa"/>
  </g>
  <path d="M72 204 l3 -7 l3 7 l7 3 l-7 3 l-3 7 l-3 -7 l-7 -3 z" fill="#a78bfa" opacity="0.85"/>
  <circle cx="94" cy="176" r="3" fill="#22d3ee" opacity="0.8"/>

  <!-- Back Hair (Silver-Lavender Bob) -->
  <path d="M142 128 C126 175 124 232 138 268 C154 276 266 276 282 268 C296 232 294 175 278 128 C264 80 156 80 142 128 Z" fill="url(#cdxHairShade)" stroke="#232036" stroke-width="2.8" stroke-linejoin="round"/>

  <!-- Legs & Knee-High Socks & Mary Jane Shoes -->
  <g stroke="#232036" stroke-width="2.6" stroke-linejoin="round">
    <!-- Left leg -->
    <path d="M168 424 L162 540 L172 670 L196 670 L198 540 L204 424 Z" fill="#ffe6dc"/>
    <path d="M163 546 L172 670 L196 670 L198 546 Z" fill="#1d2033"/>
    <path d="M163 554 L198 554" stroke="#a78bfa" stroke-width="3.2"/>
    <path d="M163 562 L198 562" stroke="#22d3ee" stroke-width="1.8"/>
    <path d="M164 666 C158 686 154 704 174 708 C194 712 203 700 200 666 Z" fill="#131626"/>
    <path d="M164 674 Q182 682 199 674" fill="none" stroke="#a78bfa" stroke-width="2.6"/>

    <!-- Right leg -->
    <path d="M216 424 L222 540 L236 666 L260 662 L254 536 L252 424 Z" fill="#ffe6dc"/>
    <path d="M223 544 L236 666 L260 662 L254 540 Z" fill="#1d2033"/>
    <path d="M223 552 L254 548" stroke="#a78bfa" stroke-width="3.2"/>
    <path d="M224 560 L255 556" stroke="#22d3ee" stroke-width="1.8"/>
    <path d="M232 660 C230 682 234 702 256 700 C276 698 276 682 262 658 Z" fill="#131626"/>
    <path d="M234 668 Q250 676 264 666" fill="none" stroke="#a78bfa" stroke-width="2.6"/>
  </g>

  <!-- Arms -->
  <g stroke="#232036" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round">
    <!-- Left arm gently holding skirt -->
    <path d="M162 246 C140 278 124 316 116 350 C112 362 124 374 134 366 C144 352 152 316 172 274" fill="#ffe6dc"/>
    <!-- Right arm waving / gesturing -->
    <path d="M258 246 C284 268 304 282 322 254 C332 238 346 244 338 262 C320 296 290 302 252 276" fill="#ffe6dc"/>
  </g>

  <!-- Crisp White Puffed-Sleeve Blouse -->
  <g stroke="#232036" stroke-width="2.6" stroke-linejoin="round">
    <path d="M164 232 C142 236 134 264 148 282 L168 278 Z" fill="#ffffff"/>
    <path d="M256 232 C278 236 286 264 272 282 L252 278 Z" fill="#ffffff"/>
    <path d="M166 232 L254 232 L248 312 L172 312 Z" fill="#fbfaff"/>
    <!-- Ruffled collar -->
    <path d="M174 230 L210 258 L246 230 L234 222 L210 240 L186 222 Z" fill="#ffffff"/>
    <!-- Violet ribbon bow -->
    <path d="M210 250 L190 242 L192 262 Z M210 250 L230 242 L228 262 Z" fill="#8b5cf6"/>
    <path d="M206 254 L196 286 L207 282 Z M214 254 L224 286 L213 282 Z" fill="#7c3aed"/>
    <circle cx="210" cy="252" r="5" fill="#c4b5fd"/>
  </g>

  <!-- High-Waisted Carbon Pleated Dress Skirt -->
  <g stroke="#232036" stroke-width="2.6" stroke-linejoin="round">
    <path d="M172 308 L248 308 L252 332 L168 332 Z" fill="#232740"/>
    <circle cx="192" cy="320" r="3" fill="#22d3ee" stroke="none"/>
    <circle cx="228" cy="320" r="3" fill="#22d3ee" stroke="none"/>
    <path d="M168 332 L118 446 C158 462 262 462 302 446 L252 332 Z" fill="url(#cdxSkirt)"/>
    <!-- Pleat lines -->
    <path d="M186 332 L156 452 M204 332 L196 456 M220 332 L232 456 M236 332 L268 450" stroke="#3c4266" stroke-width="2"/>
    <!-- Electric Violet-Cyan Circuit Hem Trim -->
    <path d="M126 432 C164 446 256 446 294 432" fill="none" stroke="url(#cdxGlow)" stroke-width="3.2" stroke-linecap="round"/>
    <path d="M134 422 L150 426 L158 418 L174 424 M246 424 L262 418 L270 426 L286 422" fill="none" stroke="#22d3ee" stroke-width="1.8" stroke-linecap="round"/>
  </g>

  <!-- Neck & Head -->
  <path d="M198 206 L198 234 Q210 242 222 234 L222 206 Z" fill="#ffd9cc" stroke="#232036" stroke-width="2.4"/>
  <path d="M164 134 C164 96 256 96 256 134 C256 178 242 212 210 216 C178 212 164 178 164 134 Z" fill="#ffe8df" stroke="#232036" stroke-width="2.6"/>

  <!-- Eyes & Expression -->
  <g>
    <!-- Left eye -->
    <ellipse cx="187" cy="164" rx="11.5" ry="13.5" fill="#ffffff"/>
    <ellipse cx="188" cy="165" rx="9.5" ry="11.5" fill="url(#cdxEye)"/>
    <ellipse cx="188" cy="167" rx="4.5" ry="5.5" fill="#1b143a"/>
    <circle cx="184" cy="160" r="3.4" fill="#ffffff"/>
    <circle cx="192" cy="171" r="1.8" fill="#a5f3fc"/>
    <path d="M174 156 Q187 148 200 156" fill="none" stroke="#232036" stroke-width="3.2" stroke-linecap="round"/>

    <!-- Right eye -->
    <ellipse cx="233" cy="164" rx="11.5" ry="13.5" fill="#ffffff"/>
    <ellipse cx="232" cy="165" rx="9.5" ry="11.5" fill="url(#cdxEye)"/>
    <ellipse cx="232" cy="167" rx="4.5" ry="5.5" fill="#1b143a"/>
    <circle cx="228" cy="160" r="3.4" fill="#ffffff"/>
    <circle cx="236" cy="171" r="1.8" fill="#a5f3fc"/>
    <path d="M220 156 Q233 148 246 156" fill="none" stroke="#232036" stroke-width="3.2" stroke-linecap="round"/>

    <!-- Blush & Smile -->
    <ellipse cx="177" cy="180" rx="8" ry="4" fill="#ff9bb5" opacity="0.48"/>
    <ellipse cx="243" cy="180" rx="8" ry="4" fill="#ff9bb5" opacity="0.48"/>
    <path d="M202 192 Q210 199 218 192" fill="none" stroke="#8c5460" stroke-width="2.2" stroke-linecap="round"/>
  </g>

  <!-- Front Hair & Bangs + Hexagonal Hairpin -->
  <g stroke="#232036" stroke-width="2.6" stroke-linejoin="round">
    <path d="M150 144 C148 94 176 74 210 74 C244 74 272 94 270 144 C264 128 258 116 250 112 L248 158 L236 124 L224 162 L212 120 L198 160 L186 122 L172 156 L168 114 C160 120 154 130 150 144 Z" fill="url(#cdxHair)"/>
    <!-- Side locks -->
    <path d="M154 134 C144 172 146 218 160 250 C168 232 168 188 166 150 Z" fill="url(#cdxHair)"/>
    <path d="M266 134 C276 172 274 218 260 250 C252 232 252 188 254 150 Z" fill="url(#cdxHair)"/>
    <!-- Hair highlight -->
    <path d="M174 106 Q210 96 246 106" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" opacity="0.72"/>
    <!-- Hexagonal Codex Hairpin -->
    <polygon points="256,112 266,118 266,130 256,136 246,130 246,118" fill="#8b5cf6" stroke="#22d3ee" stroke-width="2"/>
    <circle cx="256" cy="124" r="3.5" fill="#ffffff" stroke="none"/>
  </g>
</svg>
